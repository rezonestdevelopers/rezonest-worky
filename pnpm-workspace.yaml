# Packages allowed to run install scripts (pnpm 11 reads this here, not from package.json)
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security fixes in packages the app uses indirectly (see docs/DECISIONS.md, D-84).
overrides:
  postcss: "^8.5.23"
  uuid: "^11.1.1"
  "@auth/core": "^0.41.3"

